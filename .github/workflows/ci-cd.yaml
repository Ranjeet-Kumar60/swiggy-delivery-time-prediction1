name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # Checkout code
      # ------------------------------
      - name: Code Checkout
        uses: actions/checkout@v4

      # ------------------------------
      # Python setup
      # ------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------
      # Install CI dependencies
      # ------------------------------
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # ------------------------------
      # Configure AWS credentials
      # ------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # ------------------------------
      # Pull DVC artifacts
      # ------------------------------
      - name: DVC Pull
        run: |
          dvc pull

      # ------------------------------
      # Run tests
      # ------------------------------
      - name: Test Model Registry
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_registry.py

      - name: Test Model Performance
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_perf.py

      # ------------------------------
      # Promote model (business logic)
      # ------------------------------
      - name: Promote Model
        if: success()
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python scripts/promote_model_to_prod.py

      # ------------------------------
      # Login to Amazon ECR
      # ------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------
      # Build & push Docker image
      # ------------------------------
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: food_delivery_time_prediction
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # ------------------------------
      # Package CodeDeploy artifacts
      # ------------------------------
      - name: Zip deployment bundle
        run: |
          zip -r deployment.zip appspec.yml scripts/start_docker.sh

      # ------------------------------
      # Upload artifact to S3
      # ------------------------------
      - name: Upload bundle to S3
        run: |
          aws s3 cp deployment.zip s3://deliverytimepredictiondeploymentbuckets/deployment.zip
